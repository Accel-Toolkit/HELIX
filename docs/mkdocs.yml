site_name: HELIX User Manual
site_description: Comprehensive reference for the HELIX particle-accelerator simulation toolkit
site_url: https://example.invalid/helix-manual/
repo_url: https://github.com/Abhishek-Pathak-90/HELIX
repo_name: Abhishek-Pathak-90/HELIX
edit_uri: ""
docs_dir: manual
site_dir: ../site
use_directory_urls: false   # produces flat .html files so links work via file:// URLs

theme:
  name: material
  logo: assets/helix-logo.png
  favicon: assets/helix-favicon.png
  palette:
    # Dark mode (default — matches the HELIX identity)
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: cyan
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
    # Light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: cyan
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - navigation.indexes
    - navigation.top
    - navigation.tracking
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - content.tooltips
  icon:
    repo: fontawesome/brands/github
    edit: material/pencil
    view: material/eye
  font:
    text: Inter
    code: JetBrains Mono

markdown_extensions:
  - admonition
  - attr_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      base_path:
        - manual
        - ../examples
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

plugins:
  - search
  - offline   # inlines the search index so search works under file:// URLs

extra_javascript:
  - assets/js/palette_toggle.js
  - https://polyfill.io/v3/polyfill.min.js?features=es6
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

extra_css:
  - assets/css/custom.css

