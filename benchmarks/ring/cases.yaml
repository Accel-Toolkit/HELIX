# Ring-mode benchmark cases (grows with each milestone; see README.md).
# level: L0 analytic/bookkeeping, L1 maps and ring optics, L2 single particle,
#        L3 space charge, L4 injection, L5 many turns (losses and space charge through
#        transition, painting)
# fixture: public (cases on private lattices are kept outside public releases);
# milestone: where the case becomes a gate
cases:
  - id: L0.detect
    level: L0
    milestone: M0
    what: ring detection with negative controls (open spiral, half ring, straight line)
    reference: analytic geometry
    test: tests/ring/test_detect_config_particles.py
    fixture: public
  - id: L0.coords
    level: L0
    milestone: M0
    what: exact coordinate conversions (HELIX, time lag, MAD-X), reference change, H- stripping
    reference: reference code A's particle model (stored numbers); 50-digit mpmath
    tolerance: round-off (atol 1e-15 vs the reference; <= 2 ulp vs mpmath)
    test: tests/ring/test_coords.py
    fixture: public
  - id: L1.import_line_booster
    level: L1
    milestone: M0
    what: the simple Booster deck (LINE, inherited magnets) imported directly; one-turn optics
    reference: MAD-X TWISS (RF voltage zero in both)
    tolerance: Q, beta, alpha, Dx within 1e-9
    test: tests/io/test_madx_lines.py::test_simple_booster_line_import_matches_madx
    fixture: public
  - id: L1.import_deferred
    level: L1
    milestone: M0
    what: deferred (:=) attributes and elem->attr evaluated at use, as MAD-X
    reference: MAD-X
    tolerance: exact element lengths
    test: tests/io/test_madx_lines.py::test_deferred_semantics_match_madx
    fixture: public
  - id: L1.kernels_reference_a
    level: L1
    milestone: M1
    what: each ring kernel against the same element of reference code A (24 cases), plain Python and compiled
    reference: reference code A (stored; dev-only generator)
    tolerance: 1e-13 relative (zeta 1e-14 m); three cases set by the reference's own rounding, documented in the test
    test: tests/ring/test_kernels_cartesian_reference.py
    fixture: public
  - id: L1.symplectic
    level: L1
    milestone: M1
    what: every node's map symplectic in canonical coordinates (28 maps, 50-digit Jacobians; a non-symplectic map as the negative control)
    reference: analytic (J^T S J = S)
    tolerance: 1e-12 (measured <= 2e-16)
    test: tests/ring/test_kernels_symplectic.py
    fixture: public
  - id: L1.ring_optics
    level: L1
    milestone: M1
    what: ring kernels' optics on the simple Booster (Q incl. integer part, Twiss and dispersion at 72 points, Q' with and without the bends' K2, alpha_c, gamma_t, 6-D Qs); pole-face models against reference code A's own optics
    reference: MAD-X 5.09 TWISS and PTC_TWISS; reference code A (stored)
    tolerance: Q 1e-6, beta/alpha/D 1e-6, Q' 0.02 vs MAD-X TWISS and 2e-3 vs PTC_TWISS, alpha_c 1e-6 (measured Q 2e-9, Q' 0.003)
    test: tests/ring/test_optics_booster.py
    fixture: public
  - id: L1.fodo_analytic
    level: L1
    milestone: M1
    what: thin-lens FODO ring, exact and paraxial drifts
    reference: analytic (2x2 cell matrix; thin-lens chromaticity sum)
    tolerance: Q, beta, alpha 1e-12; Q' 1e-6
    test: tests/ring/test_optics_fodo.py
    fixture: public
  - id: L1.one_turn_contract
    level: L1
    milestone: M1
    what: every element's ring map linearized at the reference vs HELIX's own linac element matrix; the whole turn
    reference: HELIX compute_transfer_matrix / get_element_matrix
    tolerance: 1e-10 per element (50-digit Jacobians); whole turn 2e-8 (float64 finite-difference floor)
    test: tests/ring/test_one_turn_contract.py
    fixture: public
  - id: L1.curvilinear_reference
    level: L1
    milestone: M1
    what: 1000 protons, two turns of the simple Booster, particle by particle; single elements; the reference's tunes and chromaticity; the curvilinear-vs-Cartesian difference explained as a sextupole -h k1
    reference: reference code B (stored; dev-only generator)
    tolerance: x 2e-11 m, y 5e-14 m, ct 5e-12 m after two turns (the reference's own rounding, measured against a 40-digit run; 1e-12 relative is not reachable); single elements 1e-15 relative, beyond it only where the reference rounds differently (measured against 40-digit evaluations, at most 2.9e-10 m); Q 3e-8, Q' 2e-3
    test: tests/ring/test_curvilinear_reference.py
    fixture: public
  - id: L1.backends
    level: L1
    milestone: M1
    what: compiled serial, multi-core and plain-Python kernels bit for bit; the CUDA kernel in numba's simulator
    reference: the CPU kernels
    tolerance: bit for bit; CUDA simulator 1e-15 relative
    test: tests/ring/test_kernels_backends.py
    fixture: public
  - id: L1.psb_chicane
    level: L1
    milestone: M1
    what: PSB injection chicane vs reference code A's pins (closed orbit -45.739596 mm, Q 4.396759/4.474427)
    reference: reference code A's test data (PSB chicane)
    status: blocked — the PSB deck nests sequences and CALLs its strengths, which the MAD-X importer does not read (an importer gap kept out of M1)
    fixture: public
  - id: L2.invariants
    level: L2
    milestone: M2
    what: a small-amplitude particle in a thin-lens FODO ring, 10^6 turns through the turn loop; its Courant-Snyder invariants at the end vs the start (measured 3.6e-12)
    reference: analytic (symplectic map, no drift)
    tolerance: 1e-9 relative
    test: tests/ring/test_engine.py::test_invariants_do_not_drift
    fixture: public
  - id: L2.fodo_ring_tune
    level: L2
    milestone: M2
    what: a FODO ring from reference code B's examples — tune by NAFF over 100 periods (0.188242184, the cell's to 2.2e-12), alpha_x, beta_x at the start
    reference: the reference's published numbers (Q 0.1883, alpha -1.59050035, beta 2.82161941; its rtol 1e-3); the thick-lens cell analytically
    tolerance: rtol 1e-3 against the reference; analytic 1e-12; NAFF vs the cell 1e-6
    test: tests/ring/test_storage_benchmarks.py
    fixture: public
  - id: L2.naff_tunes
    level: L2
    milestone: M2
    what: simple Booster, 1000 turns, one probe — NAFF tunes = the 6-D one-turn map's eigentunes (RF on; measured Qx 4.8e-10, Qy 2.0e-9, Qs 2.2e-10) and = the 4-D tunes (RF off; 1.1e-9, 2.2e-9); NAFF itself on pure tones to rounding from 3 periods on (tests/ring/test_naff.py)
    reference: the ring optics (one-turn map)
    tolerance: 1e-8 (Qs 1e-7); the plan asks 1e-4
    test: tests/ring/test_engine.py::test_probe_tunes_are_the_one_turn_maps
    fixture: public
  - id: L2.rf_bucket
    level: L2
    milestone: M2
    what: stationary bucket — started at zeta 0, 0.97 of the bucket height oscillates, 1.03 never turns back; above transition the 180-degree bucket and Qs
    reference: the analytic separatrix (rf_bucket)
    test: tests/ring/test_engine.py::test_the_separatrix_separates; tests/ring/test_optics_edges.py
    fixture: public
  - id: L2.restart
    level: L2
    milestone: M2
    what: a run restarted from its checkpoint vs the uninterrupted run (also with every particle lost at the checkpoint's turn); one thread vs all; a checkpoint of another ring, or a restart with other probes or statistics interval, refused
    reference: the uninterrupted run
    tolerance: bit for bit
    test: tests/ring/test_engine.py
    fixture: public
  - id: L0.programs
    level: L0
    milestone: M3
    what: energy programs (resonant cycle, tables in three quantities), voltage and phase programs, validation; the phase rule, its mirror above transition, the cap and the refusal; paraphasing below and above transition, by number and by name pattern, and its refusals (cancelling, overlapping, beyond the ring); negative voltages (an H- deck, one reversed cavity) and other harmonics; a turn written into the node table; steerers that keep their field
    reference: analytic
    tolerance: 1e-14 (phase rule), 1e-13 (program ends)
    test: tests/ring/test_programs.py
    fixture: public
  - id: L0.running_totals
    level: L0
    milestone: M3
    what: over 2000 turns the turn times add up to the reference's clock and the cavities' gains to its energy; turns to the end on the program's clock; the reference change exact and an identity without gain; the one-turn map's determinant over ramped turns
    reference: analytic (sums; det = (p_start/p_end)^3, vertical block p_start/p_end)
    tolerance: sums 1e-13; det 2e-6 (6-D, central differences) and 1e-10 (vertical)
    test: tests/ring/test_programs.py
    fixture: public
  - id: L2.ramp_follows
    level: L2
    milestone: M3
    what: 300 turns of a bunch through a resonant cycle — the run's reference record vs the reference alone; adiabatic damping (normalized vertical emittance and longitudinal emittance in eV s conserved while beta0 gamma0 grows 3 %; measured 3.3e-4 and 3.7e-4); Qs of the first turn's RF focusing vs the accelerating bucket (1.2e-3) and the probe's NAFF Qs within 2 % of the range between the bucket's at the start and end
    reference: analytic (adiabatic invariant, accelerating-bucket Qs); the reference alone
    tolerance: bit for bit (reference); emittance 2e-3; Qs 2e-3 (map), 2 % (tracked)
    test: tests/ring/test_ramp.py
    fixture: public
  - id: L2.bucket_accelerating
    level: L2
    milestone: M3
    what: reference code A's accelerating bucket (Qs 0.0032729 below / 0.00176525 above transition, its ends -8.33333 / 4.7699056 m and mirrored); particles at 0.97 of the separatrix stay in every turn's bucket for 2.5 synchrotron periods of a 0.2 MV ramp at phi_s 30 deg, at 1.03 every one leaves
    reference: reference code A's test of a bucket with a changing reference energy (its pinned numbers); the analytic separatrix
    tolerance: Qs 1e-7, ends 1e-4 m (the reference's own); measured Qs 6.3e-8
    test: tests/ring/test_ramp.py::test_the_accelerating_bucket_against_reference_code_a; tests/ring/test_ramp.py::test_the_accelerating_separatrix_separates
    fixture: public
  - id: L2.transition
    level: L2
    milestone: M3
    what: a bunch started 150 turns below transition — the phase jumps to 180 deg - phi_s on the first turn above gamma_t, the bunch is shortest within 50 turns of it, no loss; a ramp started above transition reports no crossing, a decelerating one the downward crossing; a flat ramp is the fixed-energy ring (centroid 1e-12, moments 1e-9); restart bit for bit and refused with another ramp; threads bit for bit; the CUDA kernel in numba's simulator (1e-14)
    reference: analytic; the fixed-energy ring; the uninterrupted run
    test: tests/ring/test_ramp.py
    fixture: public
  - id: L2.ramp_reference_b
    level: L2
    milestone: M3
    what: a generic ramp of the simple Booster (15 Hz cycle 800 MeV - 6 GeV, voltage table) in two segments, from the start (600 turns) and across transition (400 turns), 200 protons — the reference's gamma and time every turn, the bunch at the recorded turns
    reference: reference code B (stored; dev-only generator, the ramp rule written again for it)
    tolerance: gamma and time 1e-12 relative (measured 8e-15, 1.1e-13); bunch ten times the measured difference, growing with the turns (x 2.5e-12 m after a turn, 5.9e-11 after 600, 1.0e-10 m and c t 6.3e-10 m across transition)
    test: tests/ring/test_ramp_reference.py
    fixture: public
  - id: L3.gaussian_field
    level: L3
    milestone: M4
    what: the 2.5-D field solve (cell-integrated Green's functions, doubled grid) on the exact cell charges of a Gaussian, round and 3:1, inside 3 rms sizes; the round beam's potential
    reference: Bassetti-Erskine (analytic); -(E1(r^2/2s^2) + ln r^2)/2
    tolerance: 1e-3 of the largest field on 128 x 128 (measured 7.0e-4 / 8.0e-4; 3.0e-3 / 3.4e-3 on 64 x 64; second order in the cell)
