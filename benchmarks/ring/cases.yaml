    milestone: M4
    what: a particle alone feels no kick; a bunch's kicks conserve its transverse momentum; the Green's functions are exactly antisymmetric (TSC and CIC)
    reference: exact
    tolerance: 1e-12 (FFT rounding)
    test: tests/ring/test_space_charge.py
    fixture: none
  - id: L3.kick_2p5d
    level: L3
    milestone: M4
    what: one kick of a cold round Gaussian bunch, 400 000 particles, 96 x 96, 256 line-density bins
    reference: J. Qiang, PRAB 28, 114602 (2025), eqs. 31-32 (analytic); reference code B's own test of this case allows 2 % / 20 % rms
    tolerance: 1e-2 rms transverse, 5e-2 rms longitudinal (measured 4.5e-3, 2.6e-2)
    test: tests/ring/test_space_charge.py
    fixture: none (analytic)
  - id: L3.pipe_images
    level: L3
    milestone: M4
    what: round pipe (exact images), rectangle (32 fitted harmonics) against the exact series, rectangle and ellipse grounding the wall, an ellipse of equal axes against the round pipe
    reference: image charges b^2/conj(w); the Fourier series of a grounded rectangle (analytic)
    tolerance: round 1e-11 field (4e-16 measured); rectangle 1e-9 potential, 1e-6 field (6e-11, 1e-8); wall 2e-3 of the span; ellipse = round 1e-9
    test: tests/ring/test_space_charge.py
    fixture: none (analytic)
  - id: L3.longitudinal
    level: L3
    milestone: M4
