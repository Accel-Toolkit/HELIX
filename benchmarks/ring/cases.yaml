  - id: L3.cross_code_bunch_in_bucket
    level: L3
    milestone: M4
    what: the simple Booster at 800 MeV, RF on, a generic bunch matched inside the 200 kV bucket (1.5e10, 0.01 eV s as 6 pi times the rms, beta_t 1160.25 m; longitudinal space charge at the centre about as strong as the RF focusing, the bunch length swinging between 0.30 and 0.41 m), the same 50 000 initial particles in every code; HELIX against reference code A (Cartesian model at its settings) and reference code B (curvilinear model at its settings, two seeds, 1000 turns)
