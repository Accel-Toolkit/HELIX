# ===========================================================================
# Simple FODO + bend cell — HELIX PALS import demo
#
# The same cell as examples/madx/fodo.madx as a PALS (Particle Accelerator
# Lattice Standard) YAML document, written by the lattix translator.  Open
# it in HELIX via  File -> Open Lattice...  (*.pals.yaml / *.pals.json are
# in the file filter) or on the command line:
#     python -m linac_gen run examples/pals/fodo.pals.yaml --energy 800 --freq 352.21
# The import needs the optional 'lattix' package (not yet published: install lattix into this environment, or
# HELIX_LATTIX_ROOT pointing at a checkout).  PALS carries lab fields
# (Bn1 in T/m) and the reference particle explicitly.
# ===========================================================================
# PALS document written by lattix 0.0.1 from madx
# https://github.com/pals-project/pals
PALS:
  version: null
  notes:
  - written by lattix 0.0.1 from madx
  facility:
  - variables:
    - lquad: 0.3
    - kfocus: 0.6
    - lbend: 1.0
    - abend: 0.1
    - ehalf: 0.05
  - qf:
      kind: Quadrupole
      length: 0.3
      MagneticMultipoleP:
        Bn1: 2.928617935551388
  - drift_0:
      kind: Drift
      length: 0.7
  - b1:
      kind: Bend
      length: 1.0
      BendP:
        angle_ref: 0.1
        e1: 0.05
        e2: 0.05
  - drift_1:
      kind: Drift
      length: 1.0
  - qd:
      kind: Quadrupole
      length: 0.3
      MagneticMultipoleP:
        Bn1: -2.928617935551388
  - drift_2:
      kind: Drift
      length: 1.0
  - drift_3:
      kind: Drift
      length: 1.3
  - m1:
      kind: Marker
  - fodo:
      kind: BeamLine
      line:
      - begin:
          kind: BeginningEle
          ReferenceP:
            species_ref: proton
            E_tot_ref: 1738272000.0
      - qf
      - drift_0
      - b1
      - drift_1
      - qd
      - drift_2
      - b1
      - drift_3
      - m1
  - fodo_lattice:
      kind: Lattice
      branches:
      - fodo
  - use: fodo_lattice
