name: Tests

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  linux:
    name: Core suite (ubuntu)
    runs-on: ubuntu-latest
    env:
      LINAC_GEN_DISABLE_CPP: "1"   # pure-Python kernels on CI
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install HELIX (core)
        run: |
          pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run the core suite
        # GUI (PyQt6) and torch-heavy dirs are exercised in the full local
        # suite (3,600+ tests); CI gates the pure-Python physics core.
        run: |
          pytest tests/core tests/elements tests/io tests/matching tests/assist -q

  macos:
    name: Core suite (macOS)
    runs-on: macos-latest
    # macOS runners bill 10x on PRIVATE repos — this leg enables itself
    # automatically once the repository is public (Actions then free).
    # Meanwhile macOS coverage comes from the maintainer's local
    # full-suite runs.
    if: github.event.repository.private == false
    env:
      LINAC_GEN_DISABLE_CPP: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install HELIX (core)
        run: |
          pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run the core suite
        run: |
          pytest tests/core tests/elements tests/io tests/matching tests/assist -q
