name: Tests

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  core:
    name: Core suite (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    env:
      LINAC_GEN_DISABLE_CPP: "1"   # pure-Python kernels on CI
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install HELIX (core)
        run: |
          pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run the core suite
        # GUI (PyQt6) and torch-heavy dirs are exercised in the full local
        # suite (3,600+ tests); CI gates the pure-Python physics core.
        # Torch/Qt-dependent tests inside these dirs importorskip cleanly.
        run: |
          pytest tests/core tests/elements tests/io tests/matching tests/assist -q
